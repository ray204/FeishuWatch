plugins { id 'com.android.application' }

android {
    namespace 'io.github.ray204.feishuwatch'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.ray204.feishuwatch'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.2.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"' + (project.findProperty('serverUrl') ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    lint { abortOnError true }
}
def legalAssetsDir = layout.buildDirectory.dir('generated/legalAssets')
tasks.register('syncLegalAssets', Sync) {
    from(rootProject.file('LICENSE')) { rename { 'LICENSE.txt' } }
    from(rootProject.file('COPYRIGHT.md'))
    from(rootProject.file('THIRD_PARTY_NOTICES.md'))
    from(rootProject.file('docs/licenses')) { into 'licenses' }
    into legalAssetsDir
}
android.sourceSets.main.assets.srcDir(legalAssetsDir)
tasks.named('preBuild').configure { dependsOn('syncLegalAssets') }
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
