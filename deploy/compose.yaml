services:
  bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../server/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_FILE: /app/data/state.enc
    volumes:
      - bridge_data:/app/data
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in server/.env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - bridge
volumes:
  bridge_data:
  caddy_data:
  caddy_config:
