name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix server
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FeishuWatch-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell wm size 372x430
            adb shell wm density 240
            ./gradlew connectedDebugAndroidTest
            adb pull /sdcard/Android/data/io.github.ray204.feishuwatch/files/screenshots app/build/watch-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: API30-system-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/watch-screenshots/
