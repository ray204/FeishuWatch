name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix server
      - name: Build and smoke test deployment image
        run: |
          docker build -f deploy/Dockerfile -t feishu-watch:test .
          docker run -d --name feishu-watch-test -p 127.0.0.1:8787:8787 \
            -e PUBLIC_URL=https://example.test -e FEISHU_APP_ID=fixture \
            -e FEISHU_APP_SECRET=fixture -e STORE_KEY="$(openssl rand -hex 32)" feishu-watch:test
          trap 'docker rm -f feishu-watch-test' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/healthz > /tmp/health.json; then break; fi
            sleep 1
          done
          node -e 'const fs=require("fs"); if(JSON.parse(fs.readFileSync("/tmp/health.json")).ok!==true) process.exit(1)'
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FeishuWatch-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: API30-system-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/watch-screenshots/
